name: Test

on: [ push, pull_request ]

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned Lua test dependencies
        run: scripts/setup-tests.sh

      - name: Run Busted and Lua syntax checks
        run: scripts/test.sh

