name: Releases

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned Lua test dependencies
        run: scripts/setup-tests.sh

      - name: Run Busted and Lua syntax checks
        run: scripts/test.sh

      - name: Zip release
        run: |
          cd ..
          zip -r storygraph.koplugin.zip storygraph.koplugin -x '*/*.git*' '*/spec/*' '*/lua_modules/*' '*/.luarocks/*' '*/lua' '*/luarocks' '*/.tool-versions' '*/*.rockspec'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../storygraph.koplugin.zip
